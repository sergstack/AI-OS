name: Weekly Audit Digest

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-audit-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install development dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Run validation suite
        id: checks
        run: |
          {
            echo 'results<<RESULTS_EOF'
            for s in scripts/check_*.py; do
              if python3 "$s" >/dev/null 2>&1; then
                echo "- PASS \`$s\`"
              else
                echo "- FAIL \`$s\`"
              fi
            done
            if python3 -m pytest tests/ -q >/dev/null 2>&1; then
              echo "- PASS pytest"
            else
              echo "- FAIL pytest"
            fi
            echo 'RESULTS_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Update rolling digest issue
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKS: ${{ steps.checks.outputs.results }}
        run: |
          week_ago=$(date -u -d '7 days ago' +%Y-%m-%d)
          stale_cutoff=$(date -u -d '14 days ago' +%Y-%m-%d)
          today=$(date -u +%Y-%m-%d)

          merged=$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged \
            --search "merged:>=$week_ago" --limit 50 \
            --json number,title,author \
            --jq '.[] | "- #\(.number) \(.title) (@\(.author.login))"' || true)
          [ -n "$merged" ] || merged="- none"

          stale_issues=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "updated:<$stale_cutoff" --limit 50 \
            --json number,title \
            --jq '.[] | "- issue #\(.number) \(.title)"' || true)
          stale_prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --search "updated:<$stale_cutoff" --limit 50 \
            --json number,title \
            --jq '.[] | "- PR #\(.number) \(.title)"' || true)
          stale="$stale_issues"$'\n'"$stale_prs"
          [ "$(echo "$stale" | tr -d '[:space:]')" ] || stale="- none"

          body_file=$(mktemp)
          cat > "$body_file" <<BODY
          # Weekly AI-OS Digest — $today

          Automated post-merge oversight (see #146). Read this instead of reviewing each Tier 0/1 PR.

          ## Validation suite on \`main\`

          $CHECKS

          ## PRs merged in the last 7 days

          $merged

          ## Stale (no activity for 14+ days) — decide: act, defer, or close

          $stale

          ## Owner next action

          - Review the merged-PR list for anything unexpected (Tier 1 oversight).
          - Pick at most one improvement from stale/backlog per \`WEEKLY_AI_OS_REVIEW_TEMPLATE.md\`.
          - If any check is FAIL, open or assign a fix issue.
          BODY

          gh label create weekly-digest --repo "$GITHUB_REPOSITORY" \
            --color 1D76DB \
            --description "Automated rolling weekly audit digest" \
            --force

          digest_issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label weekly-digest --limit 100 \
            --json number \
            --jq 'max_by(.number).number // empty')

          if [ -z "$digest_issue" ]; then
            digest_issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --limit 100 \
              --json number,title \
              --jq '[.[] | select(.title | startswith("Weekly AI-OS digest"))] | max_by(.number).number // empty')
          fi

          if [ -n "$digest_issue" ]; then
            echo "Updating rolling digest issue #$digest_issue"
            gh issue edit "$digest_issue" --repo "$GITHUB_REPOSITORY" \
              --title "Weekly AI-OS digest — current as of $today" \
              --add-label ai-os \
              --add-label weekly-digest \
              --add-assignee sergstack \
              --body-file "$body_file"
          else
            echo "Creating rolling digest issue"
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Weekly AI-OS digest — current as of $today" \
              --label ai-os \
              --label weekly-digest \
              --assignee sergstack \
              --body-file "$body_file"
          fi
