name: Merge Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  merge-gate:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "Changed files:"
          echo "$files"
          # Tier 0/1 only: every path not explicitly listed needs owner review.
          # tests/test_merge_gate_protection.py cross-validates this allowlist
          # against .github/CODEOWNERS.
          auto_allowed='^(CONTRIBUTING\.md|docs/(AUTONOMOUS_EXECUTION_ADOPTION_PLAN|AUTONOMOUS_EXECUTION_STATUS_MAPPING|CODEX_GLOBAL_AI_OS_ENTRY_POLICY|REPOSITORY_MAP|rights_posture)\.md)$'
          if [ -n "$files" ] && ! echo "$files" | grep -Ev "$auto_allowed" >/dev/null; then
            echo "tier=auto" >> "$GITHUB_OUTPUT"
          else
            echo "tier=owner" >> "$GITHUB_OUTPUT"
          fi
      - name: Auto-approve and enable auto-merge
        if: steps.classify.outputs.tier == 'auto'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr edit "$PR_URL" --remove-label "needs-human-review" || true
          gh pr review "$PR_URL" --approve --body "Merge gate: changes stay within the Tier 0/1 docs allowlist. Auto-merge enabled; merge waits for required checks. Post-merge review happens in the weekly digest."
          gh pr merge "$PR_URL" --auto --merge
      - name: Mark owner review required
        if: steps.classify.outputs.tier == 'owner'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR_URL" --disable-auto || true
          gh pr edit "$PR_URL" --add-label "needs-human-review"
          gh pr review "$PR_URL" --comment --body "Merge gate: protected paths changed. Auto-merge is disabled and owner review is required via CODEOWNERS."
          echo "::notice::Protected paths changed. Auto-merge is disabled; a manual owner merge decision is required."
